<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Contact Us - The Farhan World</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="live-tv-bar">
    <div class="container">
        <div class="live-indicator"><span class="live-dot"></span><span class="live-text">LIVE</span></div>
        <div class="live-ticker"><span class="ticker-label">BREAKING:</span><div class="ticker-scroll" id="liveTicker"></div></div>
        <div class="datetime-show" id="currentDateTime"></div>
    </div>
</div>

<nav class="navbar">
    <div class="container">
        <div class="nav-brand"><a href="index.html"><span class="brand-icon"><i class="fas fa-tv"></i></span><span class="brand-text">THE FARHAN WORLD</span></a></div>
        <div class="nav-menu">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="category.html?cat=world">WORLD</a></li>
                <li><a href="category.html?cat=politics">POLITICS</a></li>
                <li><a href="category.html?cat=business">BUSINESS</a></li>
                <li><a href="category.html?cat=technology">TECH</a></li>
                <li><a href="category.html?cat=sports">SPORTS</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html" class="active">CONTACT</a></li>
            </ul>
        </div>
        <div class="nav-actions">
            <a href="admin.html" class="admin-btn"><i class="fas fa-user-shield"></i> ADMIN</a>
        </div>
    </div>
</nav>

<main class="main-content" style="padding: 50px 0;">
    <div class="container">
        <div class="contact-page">
            <h1>Contact Us</h1>
            <div class="contact-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:40px;">
                <div class="contact-info" id="contactInfo">
                    <div><i class="fas fa-envelope" style="font-size:24px; color:#c0392b;"></i><h3>Email Us</h3><p>info@thefarhanworld.com</p></div>
                    <div><i class="fas fa-phone" style="font-size:24px; color:#c0392b;"></i><h3>Call Us</h3><p>+880 1234 567890</p></div>
                    <div><i class="fas fa-map-marker-alt" style="font-size:24px; color:#c0392b;"></i><h3>Visit Us</h3><p>Dhaka, Bangladesh</p></div>
                </div>
                <div class="contact-form" style="background:#f5f5f5; padding:30px; border-radius:10px;">
                    <h3>Send us a message</h3>
                    <form id="messageForm">
                        <input type="text" placeholder="Your Name" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
                        <input type="email" placeholder="Your Email" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
                        <input type="text" placeholder="Subject" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;">
                        <textarea rows="5" placeholder="Your Message" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px;"></textarea>
                        <button type="submit" style="background:#c0392b; color:white; padding:12px 30px; border:none; border-radius:5px; cursor:pointer;">Send Message <i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom"><p>&copy; 2026 THE FARHAN WORLD. All Rights Reserved.</p></div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
    function loadContactInfo() {
        const email = localStorage.getItem('farhan_contact_email') || 'info@thefarhanworld.com';
        const phone = localStorage.getItem('farhan_contact_phone') || '+880 1234 567890';
        const address = localStorage.getItem('farhan_contact_address') || 'Dhaka, Bangladesh';
        
        const contactInfo = document.getElementById('contactInfo');
        contactInfo.innerHTML = `
            <div><i class="fas fa-envelope" style="font-size:24px; color:#c0392b;"></i><h3>Email Us</h3><p>${email}</p></div>
            <div><i class="fas fa-phone" style="font-size:24px; color:#c0392b;"></i><h3>Call Us</h3><p>${phone}</p></div>
            <div><i class="fas fa-map-marker-alt" style="font-size:24px; color:#c0392b;"></i><h3>Visit Us</h3><p>${address}</p></div>
        `;
        
        const footerEmail = document.getElementById('footerEmail');
        const footerPhone = document.getElementById('footerPhone');
        const footerAddress = document.getElementById('footerAddress');
        if (footerEmail) footerEmail.innerHTML = `<i class="fas fa-envelope"></i> ${email}`;
        if (footerPhone) footerPhone.innerHTML = `<i class="fas fa-phone"></i> ${phone}`;
        if (footerAddress) footerAddress.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${address}`;
    }
    
    document.getElementById('messageForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Thank you for your message! We will get back to you soon.');
        e.target.reset();
    });
    
    loadContactInfo();
</script>
</body>
</html>
