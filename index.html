<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Farhan World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }
        .header {
            background: #1a1a2e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        .news-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .news-card:hover {
            transform: translateY(-5px);
        }
        .news-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .news-card-content {
            padding: 18px;
        }
        .category {
            background: #c0392b;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
        }
        h3 {
            margin: 12px 0;
            font-size: 18px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 THE FARHAN WORLD</h1>
        <p>Latest News & Updates</p>
    </div>
    <div class="container">
        <h2>Latest News</h2>
        <div class="news-grid" id="newsGrid">
            <div class="loading">Loading posts...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOKSPMSNaFP167R-uWtvwVegH3exOViRQ",
            authDomain: "the-farhan-world.firebaseapp.com",
            projectId: "the-farhan-world",
            storageBucket: "the-farhan-world.firebasestorage.app",
            messagingSenderId: "753468735885",
            appId: "1:753468735885:web:9081e32ea3efdb2033fdc4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadPosts() {
            const newsGrid = document.getElementById('newsGrid');
            newsGrid.innerHTML = '<div class="loading">Loading posts...</div>';
            
            try {
                // Simple query - no filters
                const snapshot = await db.collection('posts').get();
                const posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                console.log("Total posts found:", posts.length);
                
                if (posts.length === 0) {
                    newsGrid.innerHTML = '<div class="loading">No posts yet. Create one from admin panel!</div>';
                    return;
                }
                
                // Sort by date (newest first)
                posts.sort((a, b) => {
                    const dateA = a.createdAt ? a.createdAt.toDate() : new Date(0);
                    const dateB = b.createdAt ? b.createdAt.toDate() : new Date(0);
                    return dateB - dateA;
                });
                
                newsGrid.innerHTML = posts.map(post => `
                    <div class="news-card" onclick="location.href='post.html?id=${post.id}'">
                        <img src="${post.image || 'https://picsum.photos/400/250'}" alt="${post.headline || 'News'}">
                        <div class="news-card-content">
                            <span class="category">${post.category || 'News'}</span>
                            <h3>${post.headline || 'No Title'}</h3>
                            <p>${(post.excerpt || '').substring(0, 100)}...</p>
                            <small>${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleDateString() : 'New'}</small>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error loading posts:", error);
                newsGrid.innerHTML = '<div class="loading">Error loading posts. Check console.</div>';
            }
        }

        loadPosts();
    </script>
</body>
</html>
