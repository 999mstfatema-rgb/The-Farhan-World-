<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Category - The Farhan World</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="live-tv-bar">
    <div class="container">
        <div class="live-indicator"><span class="live-dot"></span><span class="live-text">LIVE</span></div>
        <div class="live-ticker"><span class="ticker-label">BREAKING:</span><div class="ticker-scroll" id="liveTicker"></div></div>
        <div class="datetime-show" id="currentDateTime"></div>
    </div>
</div>

<nav class="navbar">
    <div class="container">
        <div class="nav-brand"><a href="index.html"><span class="brand-icon"><i class="fas fa-tv"></i></span><span class="brand-text">THE FARHAN WORLD</span></a></div>
        <div class="nav-menu">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="category.html?cat=world">WORLD</a></li>
                <li><a href="category.html?cat=politics">POLITICS</a></li>
                <li><a href="category.html?cat=business">BUSINESS</a></li>
                <li><a href="category.html?cat=technology">TECH</a></li>
                <li><a href="category.html?cat=sports">SPORTS</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
        <div class="nav-actions">
            <a href="admin.html" class="admin-btn"><i class="fas fa-user-shield"></i> ADMIN</a>
        </div>
    </div>
</nav>

<main class="main-content" style="padding: 50px 0;"></main>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom"><p>&copy; 2026 THE FARHAN WORLD. All Rights Reserved.</p></div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('cat');
    
    const categoryNames = {
        world: 'World News',
        politics: 'Politics',
        business: 'Business',
        technology: 'Technology',
        sports: 'Sports',
        entertainment: 'Entertainment'
    };
    
    async function loadCategory() {
        if (!category) return;
        const posts = await getPostsByCategory(category);
        document.title = `${categoryNames[category]} - The Farhan World`;
        
        const mainContent = document.querySelector('.main-content');
        mainContent.innerHTML = `
            <div class="container">
                <div class="section-header">
                    <h2><i class="fas fa-folder"></i> ${categoryNames[category]}</h2>
                </div>
                <div class="news-grid" id="categoryNewsGrid">
                    ${posts.map(post => `
                        <div class="news-card">
                            <img src="${post.image}" alt="${post.headline || post.title}">
                            <div class="news-card-content">
                                <span class="news-category">${post.category}</span>
                                <h3><a href="single.html?id=${post.id}">${post.headline || post.title}</a></h3>
                                <div class="news-meta">${new Date(post.created_at).toLocaleDateString()}</div>
                                <p>${(post.excerpt || '').substring(0, 100)}...</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    loadCategory();
</script>
</body>
</html>
