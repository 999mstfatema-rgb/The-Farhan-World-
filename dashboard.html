<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard - The Farhan World</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-dashboard-body">
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-globe-americas"></i> The Farhan World</h3>
                <p>Admin Panel</p>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="create-post.html"><i class="fas fa-plus-circle"></i> Create Post</a></li>
                    <li><a href="#" id="managePostsLink"><i class="fas fa-edit"></i> Manage Posts</a></li>
                    <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="admin-main">
            <div class="admin-header">
                <h1>Dashboard</h1>
                <div class="admin-user"><span><i class="fas fa-user-circle"></i> Admin</span></div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-newspaper"></i></div><div class="stat-info"><h3 id="totalPosts">0</h3><p>Total Posts</p></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-eye"></i></div><div class="stat-info"><h3 id="totalViews">0</h3><p>Total Views</p></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h3 id="totalVisitors">0</h3><p>Visitors</p></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-chart-line"></i></div><div class="stat-info"><h3 id="trendingScore">0</h3><p>Engagement</p></div></div>
            </div>
            
            <div class="recent-posts">
                <h2>Recent Posts</h2>
                <div class="table-responsive">
                    <table class="posts-table">
                        <thead>
                            <tr><th>ID</th><th>Headline</th><th>Category</th><th>Date</th><th>Views</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="recentPostsBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        if (!isAdminLoggedIn()) { window.location.href = 'admin.html'; }
        
        async function loadDashboard() {
            const posts = await getAllPosts();
            const published = posts.filter(p => p.status === 'published');
            const totalViews = published.reduce((sum, p) => sum + (p.views || 0), 0);
            
            document.getElementById('totalPosts').textContent = published.length;
            document.getElementById('totalViews').textContent = totalViews.toLocaleString();
            document.getElementById('totalVisitors').textContent = '12.5K';
            document.getElementById('trendingScore').textContent = '85%';
            
            const tbody = document.getElementById('recentPostsBody');
            tbody.innerHTML = posts.slice(0, 10).map(post => `
                <tr>
                    <td>${post.id}</td>
                    <td><strong>${post.headline || post.title}</strong><br><small>${(post.title || '').substring(0, 40)}</small></td>
                    <td>${post.category}</td>
                    <td>${new Date(post.created_at).toLocaleDateString()}</td>
                    <td>${post.views || 0}</td>
                    <td>
                        <button class="edit-btn" onclick="editPost(${post.id})"><i class="fas fa-edit"></i> Edit</button>
                        <button class="delete-btn" onclick="deletePostConfirm(${post.id})"><i class="fas fa-trash"></i> Delete</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function editPost(id) { window.location.href = `edit-post.html?id=${id}`; }
        
        async function deletePostConfirm(id) {
            if (confirm('Are you sure you want to delete this post?')) {
                await deletePost(id);
                alert('Post deleted successfully!');
                loadDashboard();
            }
        }
        
        document.getElementById('logoutBtn').addEventListener('click', async () => { await adminLogout(); });
        document.getElementById('managePostsLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const posts = await getAllPosts();
            const mainContent = document.querySelector('.admin-main');
            mainContent.innerHTML = `
                <div class="admin-header"><h1>Manage Posts (${posts.length})</h1><a href="create-post.html" class="btn-primary">Create New</a></div>
                <div class="recent-posts">
                    <table class="posts-table"><thead><tr><th>ID</th><th>Headline</th><th>Category</th><th>Date</th><th>Views</th><th>Actions</th></tr></thead>
                    <tbody>${posts.map(post => `
                        <tr><td>${post.id}</td><td><strong>${post.headline || post.title}</strong></td><td>${post.category}</td>
                        <td>${new Date(post.created_at).toLocaleDateString()}</td><td>${post.views || 0}</td>
                        <td><button class="edit-btn" onclick="editPost(${post.id})">Edit</button><button class="delete-btn" onclick="deletePostConfirm(${post.id})">Delete</button></td></tr>
                    `).join('')}</tbody></table>
                </div>
            `;
        });
        
        loadDashboard();
    </script>
</body>
</html>
