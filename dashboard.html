<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The Farhan World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f6f9;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            color: #1a1a2e;
        }
        .logout-btn {
            background: #c0392b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 28px;
            margin-top: 10px;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }
        .btn-primary {
            background: #c0392b;
            color: white;
        }
        .posts-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .posts-section h2 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f5f5f5;
        }
        .edit-btn, .delete-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 3px;
        }
        .edit-btn {
            background: #3498db;
            color: white;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
        }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
            table {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div>📰</div>
                <h3 id="totalPosts">0</h3>
                <p>Total Posts</p>
            </div>
            <div class="stat-card">
                <div>👁️</div>
                <h3 id="totalViews">0</h3>
                <p>Total Views</p>
            </div>
            <div class="stat-card">
                <div>👤</div>
                <h3>1</h3>
                <p>Admin</p>
            </div>
            <div class="stat-card">
                <div>📈</div>
                <h3>100%</h3>
                <p>Status</p>
            </div>
        </div>
        
        <div class="actions">
            <a href="create-post.html" class="btn btn-primary">➕ Create New Post</a>
            <button class="btn btn-primary" onclick="loadPosts()" style="background:#3498db;">🔄 Refresh</button>
        </div>
        
        <div class="posts-section">
            <h2>📝 Manage Posts</h2>
            <div id="postsList"></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'admin.html';
        }
        
        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem('farhan_posts') || '[]');
            
            document.getElementById('totalPosts').textContent = posts.length;
            const totalViews = posts.reduce((sum, p) => sum + (p.views || 0), 0);
            document.getElementById('totalViews').textContent = totalViews;
            
            const container = document.getElementById('postsList');
            
            if (posts.length === 0) {
                container.innerHTML = '<p>No posts yet. <a href="create-post.html">Create your first post</a></p>';
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Headline</th><th>Category</th><th>Date</th><th>Views</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${posts.map(post => `
                            <tr>
                                <td>${post.id}</td>
                                <td><strong>${post.headline}</strong></td>
                                <td>${post.category}</td>
                                <td>${new Date(post.date).toLocaleDateString()}</td>
                                <td>${post.views || 0}</td>
                                <td>
                                    <button class="edit-btn" onclick="editPost(${post.id})">Edit</button>
                                    <button class="delete-btn" onclick="deletePost(${post.id})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function editPost(id) {
            window.location.href = `edit-post.html?id=${id}`;
        }
        
        function deletePost(id) {
            if (confirm('Delete this post?')) {
                let posts = JSON.parse(localStorage.getItem('farhan_posts') || '[]');
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('farhan_posts', JSON.stringify(posts));
                loadPosts();
                alert('Post deleted!');
            }
        }
        
        function logout() {
            localStorage.removeItem('admin_logged_in');
            window.location.href = 'admin.html';
        }
        
        loadPosts();
    </script>
</body>
</html>
